map $host $alucard {
  default "$ALUCARD_IP";
}

map $host $trevor {
  default "$TREVOR_IP";
}

# Alucard
server {
    listen 80;
    server_name flexget.jdelpino.es;
    return 301 https://$host$request_uri;
}

server {
    listen        443 ssl;
    server_name   flexget.jdelpino.es;

    # SSL Certificate Paths (e.g., Let's Encrypt / Certbot 
    # paths)
    ssl_certificate /etc/letsencrypt/jdelpino.es/fullchain2.pem; 
    ssl_certificate_key /etc/letsencrypt/jdelpino.es/privkey2.pem;
    # Recommended SSL Security Settings

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5; ssl_prefer_server_ciphers on; 

    location / {
        proxy_pass         http://192.168.1.202:5050;
        proxy_redirect     off;

        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Ssl   on;
        
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}


