server {
    listen 80;
    server_name jdelpino.es  www.jdelpino.es;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jdelpino.es www.jdelpino.es;

    # SSL Certificate Paths (e.g., Let's Encrypt / Certbot 
    # paths)
    ssl_certificate /etc/letsencrypt/jdelpino.es/fullchain2.pem; 
    ssl_certificate_key /etc/letsencrypt/jdelpino.es/privkey2.pem;
    # Recommended SSL Security Settings

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5; ssl_prefer_server_ciphers on; 

    location / {
        proxy_pass http://$trevor;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Crucial headers to inform the backend that the 
        # request
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_set_header X-Forwarded-Ssl on;
    }
}
