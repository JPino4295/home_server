map $host $alucard {
  default "$ALUCARD_IP";
}

map $host $trevor {
  default "$TREVOR_IP";
}

# Alucard
server {
    listen        80;
    server_name   flexget.jdelpino.es;

    location / {
        proxy_pass         http://$alucard:5050;
        proxy_redirect     off;

        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
    }
}

